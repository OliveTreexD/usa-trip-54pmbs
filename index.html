<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%83%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>USA Trip Builder, Halloween 2028</title>
<style>
:root{--navy:#14213d;--coral:#ff6b5b;--coral-d:#b3362b;--coral-bg:#ffeceb;--amber:#ffb627;--amber-d:#7a4f00;--amber-bg:#fff3d6;--teal:#0e9f94;--teal-d:#05615a;--teal-bg:#e0f4f1;--plum:#5b3aa3;--plum-bg:#efe9fa;
--bg:#fbf6ef;--card:#fff;--ink:#14213d;--ink2:#3a4359;--muted:#565f75;--line:#ece2d3;--ok:#0f6e48;--ok-bg:#e3f5ec;--bad:#a8322a;--bad-bg:#fdeae8;
--r:20px;--sh:0 1px 2px rgba(20,33,61,.05),0 8px 24px rgba(20,33,61,.07)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:17.5px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--teal-d);font-weight:650}
p{margin:0 0 10px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.hero{color:#fff;background:linear-gradient(170deg,#14213d 0%,#2b2f6e 40%,#c2456a 78%,#ff8a4c 100%);padding:18px 20px 0;position:relative;overflow:hidden}
.hero-in{max-width:760px;margin:0 auto;position:relative;z-index:2;padding-bottom:8px}
.hero h1{margin:0;font-size:26px;line-height:1.2;font-weight:850;letter-spacing:-.2px}
.hero p{margin:4px 0 0;font-size:16px;opacity:.95}
.skyline{display:block;width:100%;height:34px;position:relative;z-index:1}
.bar{position:sticky;top:0;z-index:30;background:rgba(251,246,239,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;max-width:760px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 18px;min-height:46px;font-weight:750;font-size:16px;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
main{max-width:760px;margin:0 auto;padding:18px 16px 100px}
.view{display:none}.view.on{display:block}
h2.vt{font-size:25px;line-height:1.25;margin:26px 2px 6px;font-weight:850;letter-spacing:-.2px}
p.vs{margin:0 2px 18px;color:var(--ink2)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 18px;margin:0 0 18px;border:1px solid #f1e8da}
.card h3{margin:0 0 12px;font-size:20px;line-height:1.3;font-weight:800}
.muted{color:var(--muted)}.small{font-size:15.5px;line-height:1.55}.b{font-weight:800}
.meta{color:var(--muted);font-size:15.5px;margin:-6px 0 10px}
.lead2{color:var(--ink2)}
.dotsep{color:#b9ae9c;margin:0 2px}
.pill{display:inline-block;font-size:13.5px;font-weight:750;padding:3px 11px;border-radius:999px;vertical-align:middle;white-space:nowrap;line-height:1.5}
.p-coral{background:var(--coral-bg);color:var(--coral-d)}.p-teal{background:var(--teal-bg);color:var(--teal-d)}.p-amber{background:var(--amber-bg);color:var(--amber-d)}.p-plum{background:var(--plum-bg);color:var(--plum)}.p-ok{background:var(--ok-bg);color:var(--ok)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-navy{background:#e6e9f2;color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:0 20px;font-weight:750;font-size:17px;background:var(--navy);color:#fff;text-decoration:none;min-height:50px}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid #ddd2c0}
.btn.teal{background:var(--teal-d)}
.btn.sm{min-height:46px;font-size:16px;padding:0 16px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btnrow .btn{flex:1 1 140px}
.linkbtn{border:0;background:none;color:var(--teal-d);font-weight:750;padding:10px 4px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;background:#f3ebdf;border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:0 8px;font-weight:750;font-size:16px;color:var(--ink2);min-height:44px}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(20,33,61,.15)}
.seg.sm2{margin:0}.seg.sm2 button{font-size:15px;padding:0 14px;white-space:nowrap}
/* summary card */
.sum{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 18px 18px;margin:0 0 8px;box-shadow:0 10px 28px rgba(20,33,61,.22)}
.sum-top{display:flex;justify-content:space-between;align-items:center;margin:-8px 0 -4px}
.sum-k{font-size:14px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;color:#c9d1e6}
.sum .linkbtn{color:#ffd58a}
.sum h2{margin:0;font-size:21px;line-height:1.3;font-weight:800}
.sum-d{margin:4px 0 12px;color:#dfe4f1;font-size:16px}
.sum .dotsep{color:#8f9bbb}
.both{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.both div{border-radius:16px;padding:12px 14px;background:var(--teal-bg);color:var(--ink);min-width:0}
.both div.nots{background:var(--coral-bg)}
.both span{display:block;font-size:14px;font-weight:750;color:var(--ink2)}
.both b{display:block;font-size:23px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.3}
.both small{display:block;font-size:14px;color:var(--ink2);line-height:1.4}
.sum .both{margin-top:0}.sum .both div{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.14)}
.sum .both span,.sum .both small{color:#dfe4f1}
.sum .both div.cur{background:#fff;color:var(--ink);border-color:#fff}.sum .both div.cur span,.sum .both div.cur small{color:var(--ink2)}
/* show more */
details.more{margin:12px 0 0;border-top:1px solid var(--line)}
details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:50px;font-weight:750;color:var(--teal-d);font-size:16.5px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'';width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .2s}
details.more[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.more[open]>summary span{font-size:0}details.more[open]>summary span::before{content:'Show less';font-size:16.5px}
.more-in{padding:4px 0 2px}
/* glance */
ol.glance{list-style:none;margin:8px 0 6px;padding:0}
ol.glance li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}ol.glance li:first-child{border-top:0}
ol.glance li>span:nth-child(2){flex:1}ol.glance b{font-variant-numeric:tabular-nums;color:var(--ink2)}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--coral);color:#fff;font-weight:850;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.glbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:2px 0;min-height:44px;text-align:left;font-size:17.5px}.glbtn>span:nth-child(2){flex:1}
/* itinerary */
.stophead{display:flex;align-items:center;gap:12px;margin:18px 0 4px;font-size:18px}.stophead:first-child{margin-top:4px}.stophead .muted{margin-left:auto;font-size:15.5px}
.day{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.dbadge{background:#f4eee4;color:var(--ink);border-radius:14px;text-align:center;padding:6px 2px;font-weight:850;line-height:1.15;height:max-content}
.dbadge small{display:block;font-size:12.5px;font-weight:750;text-transform:uppercase;color:var(--ink2)}
.dbadge b{display:block;font-size:20px}
.day.hw .dbadge{background:var(--coral);color:#fff}.day.hw .dbadge small{color:#fff}
.day h4{margin:0;font-size:17.5px;font-weight:800;line-height:1.4}
.day p{margin:3px 0 4px;color:var(--ink2)}
details.days{border-top:1px solid var(--line)}
/* checklist */
.chk{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start;min-height:56px}
.chk:first-of-type{border-top:0}
.chk input{width:28px;height:28px;flex:none;margin-top:1px;accent-color:var(--teal-d)}
.chk.done .t b{text-decoration:line-through;color:var(--muted)}
.chk .t{flex:1;min-width:0}.chk .t b{display:block;font-weight:700;line-height:1.4}.chk .t small{display:block;color:var(--muted);font-size:15px}
.chk .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
/* cost table */
table.ct{width:100%;border-collapse:collapse}
table.ct td{padding:11px 2px;border-top:1px solid var(--line);vertical-align:top}
table.ct td:last-child{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:10px}
table.ct tr.tot td{border-top:2px solid var(--navy);font-size:18px;font-weight:850}
table.ct tr.tot2 td{font-weight:800}
table.ct small{color:var(--muted);display:block;font-size:14.5px;font-weight:500}
.note{border-radius:16px;padding:12px 14px;font-size:16px;margin:12px 0 0;line-height:1.55}
.note.warn{background:var(--amber-bg);color:#5a3b00}
.note.good{background:var(--ok-bg);color:#0b4d33}
.note.info{background:#edf2fd;color:#1f2f5c}
.note.hw{background:#fff0e5;color:#6e2c0c}
.note .linkbtn{padding:0 2px;min-height:0}
/* trips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:2px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid #ddd2c0;background:#fff;border-radius:999px;padding:0 16px;min-height:44px;font-weight:750;font-size:16px;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
details.tcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin:0 0 14px;border:1px solid #f1e8da;border-left:6px solid var(--coral)}
details.tcard.on{border-left-color:var(--teal);box-shadow:0 0 0 2px var(--teal),var(--sh)}
details.tcard>summary{list-style:none;cursor:pointer;padding:16px 18px}details.tcard>summary::-webkit-details-marker{display:none}
.tc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tc-h b{font-size:18.5px;line-height:1.35}
.tc-m{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;color:var(--ink2)}
.tc-c{font-size:22px;font-weight:850;color:var(--ink);font-variant-numeric:tabular-nums}
.tc-s{text-align:right;font-size:15px;color:var(--muted);margin-top:-2px}
.tc-t{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
details.tcard .more-in{padding:0 18px 18px;border-top:1px solid var(--line);margin-top:-2px;padding-top:14px}
.route{color:var(--ink2);font-weight:650}
/* pick */
.pk{padding:14px 0;border-top:1px solid var(--line)}.pk:first-of-type{border-top:0}
.pk-h{display:flex;gap:14px;align-items:center;min-height:44px;cursor:pointer}.pk-h input{width:28px;height:28px;flex:none;accent-color:var(--teal-d)}.pk-h b{font-size:18.5px}
.pk-why{margin:4px 0 2px 42px;color:var(--ink2)}
.pk-m{margin:0 0 0 42px;color:var(--muted);font-size:15.5px}
.pk-a{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 0 42px;flex-wrap:wrap}
.pk.on{background:linear-gradient(90deg,var(--teal-bg),rgba(224,244,241,0) 70%);margin:0 -18px;padding:14px 18px}
.pkbar{border:2px solid var(--teal-bg)}
.pickfoot{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,33,61,.1);font-size:16px;line-height:1.4}
/* map */
.mapcard{padding:16px 14px}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:#cfe6f3;height:min(62vh,440px);box-shadow:inset 0 0 0 1px rgba(20,33,61,.08)}
#mapsvg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.mapbtns button{width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.95);box-shadow:0 2px 8px rgba(20,33,61,.2);font-size:22px;font-weight:800;color:var(--navy)}
.pin{cursor:pointer}
.pin .halo{fill:#fff;filter:url(#sh)}.pin .dot{fill:var(--coral)}.pin.hw .dot{fill:#e2572b}
.pin .pn{fill:#fff;font-size:13px;font-weight:850;text-anchor:middle;pointer-events:none}
.pin .lb{font-size:14px;font-weight:750;fill:var(--navy);paint-order:stroke;stroke:#fffaf1;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.pin.sel .halo{fill:var(--amber)}.pin.sel .dot{fill:var(--navy)}
.pin.ghost .dot{fill:#fff;stroke:var(--navy);stroke-width:2.5}.pin.ghost.sug .dot{stroke:#c98a00;fill:#ffe7a8}.pin.ghost .lb{font-size:12.5px;font-weight:650;fill:var(--ink2)}
.far .pin.ghost:not(.sel) .lb{display:none}
.pickfoot .btn{white-space:nowrap;flex:none}
.pin.ghost.sel .dot{fill:var(--amber);stroke:var(--navy)}
.route{transition:none}
.mapinfo{margin-top:14px;padding:14px 16px;border-radius:16px;background:#faf5ec}
.mi-t{font-size:19px}.mi-d{color:var(--ink2);margin:2px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:15px;color:var(--ink2)}
.lg{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}.lg.a{background:var(--coral)}.lg.b{background:#fff;border:2.5px solid var(--navy)}.lg.c{background:#ffe7a8;border:2.5px solid #c98a00}
/* forms */
.optbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.optbox button{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left;min-height:72px}
.optbox button b{display:block;font-size:16.5px}.optbox button small{display:block;color:var(--ink2);font-size:14.5px;line-height:1.4}
.optbox button[aria-pressed=true]{border-color:var(--teal-d);background:var(--teal-bg)}
.optbox button.nots[aria-pressed=true]{border-color:var(--coral-d);background:var(--coral-bg)}
label.lbl{display:block;font-size:15px;font-weight:750;color:var(--ink2);margin:14px 0 6px}
input[type=date],input[type=number],input[type=text],select{width:100%;border:1.5px solid #ddd2c0;border-radius:12px;padding:10px 12px;background:#fff;min-height:50px;font-size:17px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:block}
.kv{display:grid;grid-template-columns:1fr;gap:2px;margin:6px 0 10px}.kv dt{color:var(--muted);font-weight:750;font-size:15px;margin-top:8px}.kv dd{margin:0}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:46px;height:46px;border-radius:12px;border:1.5px solid #ddd2c0;background:#fff;font-weight:850;font-size:21px;color:var(--navy)}
.stp b{min-width:28px;text-align:center;font-size:18px}
.stoprow{padding:14px 0;border-top:1px solid var(--line)}.stoprow:first-of-type{border-top:0}
.stoprow .row{flex-wrap:wrap}
.usd{display:flex;align-items:center;gap:6px}.usd input{width:120px}
/* tracker */
.tstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 10px}
.tstats div{background:#f7f1e7;border-radius:12px;padding:8px 10px;min-width:0}
.tstats span{display:block;font-size:13.5px;font-weight:750;color:var(--muted)}
.tstats b{display:block;font-size:17.5px;font-variant-numeric:tabular-nums}
.spark{width:100%;height:50px;display:block;margin:6px 0}
.log{font-size:15.5px;color:var(--ink2);margin:6px 0 10px;padding:0;list-style:none}
.log li{padding:8px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.log li button{border:0;background:none;color:var(--bad);font-weight:800;padding:0 6px;min-height:40px}
.addf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.addf .full{grid-column:1/-1}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
footer{text-align:center;font-size:15px;color:var(--muted);padding:12px 20px 30px}
ul.clean{margin:0;padding-left:20px}ul.clean li{margin:0 0 10px}
@media(min-width:720px){body{font-size:17px}}

.sumtot{background:#fff;color:var(--ink);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px}.sumtot b{font-size:30px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.1}.sumtot span{font-size:14.5px;color:var(--ink2);line-height:1.4}
.sumtot.light{background:var(--teal-bg);margin-top:12px}
/* v4: as 4, photos, sheet, map */
.sum-4{margin:-6px 0 12px;font-size:15px;color:#ffd58a}
.card.four{border-left:6px solid var(--amber)}
.wys{margin:10px 0 6px;font-size:14px;font-weight:750;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px 6px;padding:2px 18px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip figure{flex:none;width:78%;max-width:300px;margin:0;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:#f4eee4;box-shadow:0 2px 8px rgba(20,33,61,.08)}
.strip img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9e1d2}
.strip figcaption{padding:8px 12px 10px}.strip figcaption b{display:block;font-size:16px;line-height:1.35}.strip figcaption small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip.big figure{width:86%;max-width:420px}
.pk-img{float:right;position:relative;border:0;padding:0;margin:4px 0 6px 12px;width:96px;height:72px;border-radius:12px;overflow:hidden;background:#eee}
.pk-img img{width:100%;height:100%;object-fit:cover;display:block}.pk-img span{position:absolute;left:0;right:0;bottom:0;background:rgba(20,33,61,.7);color:#fff;font-size:12px;font-weight:700;padding:2px 0}
.pk::after{content:'';display:block;clear:both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:60vh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(20,33,61,.28);padding:6px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sh-grab{display:flex;justify-content:center;padding:6px 0 10px;cursor:pointer}.sh-grab span{width:44px;height:5px;border-radius:3px;background:#d8cfc0}
.sh-x{position:absolute;right:12px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:#f3ebdf;font-size:18px;font-weight:800;color:var(--navy)}
.sh-k{font-size:14px;font-weight:750;color:var(--coral-d);text-transform:uppercase;letter-spacing:.5px;padding-right:50px}
.sheet h3{margin:2px 0 2px;font-size:23px;line-height:1.25;padding-right:50px}.sh-d{color:var(--ink2);margin:0 0 12px}
.sheet h4{margin:8px 0 8px;font-size:17px}
.mapwrap{height:min(64vh,480px);background:#a9d6ec}
.shore path{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:6;stroke-linejoin:round}

  pty:{mine:1,n:3,intl:true,why:'Optional add-on: the Panama Canal and Casco Viejo. A separate country, more flying.',days:[['Panama City','Casco Viejo old town.'],['Panama Canal','Miraflores Locks.'],['Rainforest or canal boat','Or rest.']]},
  aus:{sug:1,n:2,why:'Live music capital, and 6th Street Halloween is one of the biggest street parties in Texas.',hw:'6th Street costume party downtown',days:[['Austin','South Congress and live music.'],['Barton Springs and bats','Swim, then the Congress Bridge bat flight at dusk.']]},
  sat:{sug:1,n:2,why:'The River Walk and the Alamo. Easy, pretty and cheap.',days:[['San Antonio','The Alamo and the River Walk.'],['Missions trail','Old Spanish missions by bike, or rest.']]},
  sav:{sug:1,n:3,why:'Called America\'s most haunted city. Ghost tours, mossy squares, great for Halloween.',hw:'Ghost tours and pub crawls in the historic squares, River Street parties',days:[['Savannah','Walk the squares under the Spanish moss.'],['Ghost tour night','Evening ghost walk or hearse tour.'],['Tybee Island','Beach and lighthouse, or rest.']]},
  chs:{sug:1,n:2,why:'Pretty old town, Rainbow Row, great Southern food. Pairs well with Savannah.',hw:'Ghost and graveyard tours in the old city',days:[['Charleston','Rainbow Row and the Battery.'],['Plantations or Fort Sumter','Boat to Fort Sumter, or a plantation garden.']]},
  sta:{sug:1,n:2,why:'Oldest city in the US. Ghost tours and lantern walks, small and walkable.',hw:'Ghost tours and lantern walks in the old Spanish town',days:[['St. Augustine','The old Spanish fort and St. George Street.'],['Ghost tour and beach','Beach by day, ghost walk at night.']]},
  eyw:{sug:1,n:3,why:'Island road trip down the Overseas Highway. Fantasy Fest is usually the last week or so of October (adult themed, check 2028 dates).',hw:'Fantasy Fest on Duval Street (adults only feel, check 2028 dates)',days:[['Drive to Key West','Overseas Highway, about 4 hours from Miami.'],['Key West','Hemingway House, Duval Street, Mallory Square sunset.'],['Snorkel trip','Reef boat trip, or rest.']]},
  atl:{sug:1,n:2,why:'Big flight hub with good connections. The Little Five Points Halloween parade is usually mid October.',days:[['Atlanta','Georgia Aquarium and Centennial Park.'],['MLK historic site','Then the BeltLine walk.']]},
  avl:{sug:1,n:2,why:'Peak autumn leaves in late October on the Blue Ridge Parkway.',days:[['Asheville','River Arts District and breweries.'],['Blue Ridge Parkway','Autumn leaves drive. Check road closures.']]},
  lft:{sug:1,n:1,why:'Cajun food and zydeco music. Breaks up the Houston to New Orleans drive.',days:[['Lafayette','Cajun food and a zydeco dance hall.']]},
  nat:{sug:1,n:1,why:'Old Mississippi river town with grand old homes. Breaks up a Memphis to New Orleans drive.',days:[['Natchez','Historic homes and the river bluff.']]},
  gulf:{sug:1,n:1,why:'Quiet beaches at Biloxi and Bay St. Louis, about 1.5 hours from New Orleans.',days:[['Mississippi Gulf Coast','Beach day, seafood.']]}
 }};

  const pts=it.seed.filter((_,i)=>!hide.includes(i)).map(p=>p.concat(['seed'])).concat(own.map((p,i)=>p.concat(['own',i]))).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  const latest=pts.length?pts[pts.length-1][1]:null,low=pts.length?Math.min(...pts.map(p=>p[1])):null;
  let tr='<span class="pill p-navy">No checks yet</span>';
  if(latest!=null){const d=(latest-it.target)/it.target*100;tr=d<=0?`<span class="pill p-ok">On target</span>`:`<span class="pill ${d<=10?'p-amber':'p-bad'}">${Math.round(d)}% over target</span>`;
   if(pts.length>1){const prev=pts[pts.length-2][1];tr+=' <span class="pill '+(latest<prev?'p-ok':latest>prev?'p-bad':'p-navy')+'">'+(latest<prev?'Down':latest>prev?'Up':'Same')+'</span>'}}
  return `<div class="card ti"><div class="row"><h3 style="margin:0">${esc(it.name)}</h3>${set.has(it.id)?'<span class="pill p-teal">This trip</span>':''}</div>
  <p class="meta">${esc(it.kind)}, ${esc(it.unit)}</p>
  <div class="tstats"><div><span>Latest</span><b>${latest!=null?A(latest):'-'}</b></div><div><span>Lowest</span><b>${low!=null?A(low):'-'}</b></div><div><span>Target</span><b>${A(it.target)}</b></div></div><div>${tr}</div>
  ${more('Show more and log a price',`${spark(pts,it.target)}<ul class="log">${pts.slice().reverse().map(p=>`<li><span>${fd(pd(p[0]),1)}: <b>${A(p[1])}</b> ${esc(p[2]||'')}${p[3]==='seed'?' <i>(starting estimate)</i>':''}</span>${p[3]==='own'?`<button data-del="${it.id}" data-i="${p[4]}" aria-label="Delete">Delete</button>`:''}</li>`).join('')}</ul>
  <p class="small muted">Used in: ${esc(it.used)}</p><div class="links">${it.links.map(l=>`<a class="btn alt sm" href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join('')}</div>
  <div class="addf" data-add="${it.id}"><input type="date" value="${today}" aria-label="Date checked"><input type="number" inputmode="decimal" placeholder="Price A$" aria-label="Price in A$"><input class="full" type="text" placeholder="Note (airline, dates, sale)" aria-label="Note"><button class="btn teal full" data-addbtn="${it.id}">Log this price</button></div>`)}</div>`}).join('')}
function vInfo(R){const c=(t,b,open)=>`<div class="card"><h3>${t}</h3>${open?b:more('Show more',b)}</div>`;
 $('#v-info').innerHTML=`${sumCard(R)}<h2 class="vt">Good to know</h2>`+
 c('Why late October 2028',`<ul class="clean"><li>31 Oct 2028 is a Tuesday. Every trip ends with Halloween somewhere fun: Frenchmen Street in New Orleans, the Village Halloween Parade in New York, Halloween Horror Nights in LA, or Salem.</li><li>Shoulder season: after the US summer, before Thanksgiving and Christmas fares.</li><li>Weather: New Orleans, Texas and Florida about 25 to 28 degrees, Nashville and Memphis about 20, New York and Boston 10 to 17, Hawaii about 29. The Atlantic hurricane season runs to 30 Nov, so get insurance that covers it.</li></ul>`,1)+
 c('Relaxed and safe',`<ul class="clean"><li>Each trip has a slow first day after the long flight.</li><li>Halloween crowds are huge. Keep phones and wallets in front pockets, agree a meeting point, and walk or use public transport.</li><li>Get travel insurance with good medical cover, US hospitals are very expensive.</li><li>Panama is a separate country. Check Smartraveller before booking.</li></ul>`)+
 c('Photo credits',`<p class="small">Photos are from Wikimedia Commons, used under their free licences. Tap a name to see the original.</p><ul class="clean small">${Object.entries(PH).map(([k,v])=>v.map(p=>`<li><a href="${p.u}" target="_blank" rel="noopener">${esc(p.c)}</a> (${esc(pinName(k))}): ${esc(p.a)}, ${esc(p.l)}</li>`).join('')).join('')}</ul>`)+
 c('Where the numbers come from',`<ul class="clean"><li>Exchange rate: RBA 24 Nov 2026 (A$1 = US$0.6627).</li><li>Flights: Fiji Airways, Beat That Flight, Etihad, FlightsFinder and Kayak (New Orleans), plus 2026 sale fares.</li><li>Hotels: <a href="https://engine.com/data/hotel-prices" target="_blank" rel="noopener">Engine hotel price data</a>, Bed&amp;Market, Hawaii Tourism Authority. All hotel figures are estimates with tax.</li><li>Tours: Intrepid and Trafalgar pages on 24 Nov 2026.</li><li>ESTA: <a href="https://esta.cbp.dhs.gov/" target="_blank" rel="noopener">esta.cbp.dhs.gov</a>, US$40.62 each.</li><li>Halloween: Village Halloween Parade, Salem Haunted Happenings, Krewe of Boo New Orleans.</li></ul>`)}

/* ---------- render and events ---------- */
function hero(R){$('#hLead').textContent='October 2028, around Halloween'}
function render(){const P=P_(S.p);if(S.p==='custom'&&P.id!=='custom')S.p=B.presets[0].id;const R=calc(P);hero(R);vPlan(R);vTrips(R);vPick(R);vTweak(R);vTours(R);vTrack(R);vInfo(R);
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+S.tab));
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.tab));
 if(S.tab==='map')vMap(R);else $('#v-map').innerHTML='';}
function pp(){return S.pp[S.p]||(S.pp[S.p]={})}
function go(t){if(t!==S.tab)closeSheet();S.tab=t;save();render();window.scrollTo({top:document.querySelector('.bar').offsetTop,behavior:'instant'});const b=document.querySelector('#tabs button[data-v="'+t+'"]');if(b)b.scrollIntoView({inline:'center',block:'nearest'})}
function keepOpen(fn){const open=[...document.querySelectorAll('.view.on details')].map((d,i)=>d.open?i:-1).filter(i=>i>=0);const y=window.scrollY;fn();const ds=[...document.querySelectorAll('.view.on details')];open.forEach(i=>{if(ds[i])ds[i].open=true});window.scrollTo(0,y)}
const toggleStop=k=>{const c=S.custom;const i=c.stops.indexOf(k);if(i>=0)c.stops.splice(i,1);else c.stops.push(k);delete S.pp.custom;save()};
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-chk],[data-pin]');if(!t)return;
 if(t.dataset.v)return go(t.dataset.v);
 if(t.dataset.go)return go(t.dataset.go);
 if(t.dataset.filter){S.filter=t.dataset.filter;save();return render()}
 if(t.dataset.pick){S.p=t.dataset.pick;MV.sel=null;save();return go('plan')}
 if(t.dataset.mappick){S.p=t.dataset.mappick;MV.sel=null;MV.mode='trip';save();return go('map')}
 if(t.dataset.mm){MV.mode=t.dataset.mm;closeSheet();return render()}
 if(t.dataset.zoom){return t.dataset.zoom==='fit'?setVB(MV.fit):zoom(t.dataset.zoom==='in'?.7:1.4)}
 if(t.dataset.closesheet)return closeSheet();
 if(t.dataset.pin){const k=t.dataset.pin;if(S.tab!=='map'){if(!tripPins(calc(P_(S.p))).some(p=>p.k===k))MV.mode='all';go('map');return openSheet(k)}if(MV.sel===k)return closeSheet();return openSheet(k)}
 if(t.dataset.pktog){const k=t.dataset.pktog;toggleStop(k);render();return openSheet(k)}
 if(t.dataset.pkn){const k=t.dataset.pkn,c=S.custom;const cur=c.n[k]!=null?c.n[k]:PL[k].n;c.n[k]=Math.max(1,Math.min(10,cur+(+t.dataset.d)));delete S.pp.custom;save();return keepOpen(render)}
 if(t.dataset.l!=null&&t.closest('[data-lvl]')){S.lvl=+t.dataset.l;save();return keepOpen(render)}
 if(t.dataset.carlos){pp().carlos=t.dataset.carlos;save();return render()}
 if(t.dataset.split!=null){S.split=t.dataset.split==='1';save();return render()}
 if(t.dataset.n!=null){const P=P_(S.p),i=+t.dataset.n,o=pp();o.nights=o.nights||{};const cur=o.nights[i]!=null?o.nights[i]:P.stops[i].nights;o.nights[i]=Math.max(0,Math.min(21,cur+(+t.dataset.d)));save();return render()}
 if(t.id==='reset'){delete S.pp[S.p];save();return render()}
 if(t.dataset.del){const a=S.trk[t.dataset.del]||[];a.splice(+t.dataset.i,1);save();return keepOpen(render)}
 if(t.dataset.addbtn){const f=t.closest('[data-add]');const [d,p,n]=f.querySelectorAll('input');const v=parseFloat(p.value);if(!d.value||!(v>0)){p.focus();return}
  (S.trk[t.dataset.addbtn]=S.trk[t.dataset.addbtn]||[]).push([d.value,v,n.value.trim()]);save();return keepOpen(render)}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.pk){toggleStop(t.dataset.pk);return keepOpen(render)}
 if(t.dataset.chk){const c=S.chk[S.p]=S.chk[S.p]||{};c[t.dataset.chk]=t.checked;save();return keepOpen(render)}
 if(t.id==='start'&&t.value){pp().start=t.value;save();return render()}
 if(t.dataset.h!=null){const v=parseFloat(t.value);const o=pp();o.hotel=o.hotel||{};if(v>0)o.hotel[t.dataset.h]=v;else delete o.hotel[t.dataset.h];save();return render()}
 if(t.id==='intl'){const v=parseFloat(t.value);if(v>0)pp().intl=v;else delete pp().intl;save();return render()}
 if(t.id==='fx'){const v=parseFloat(t.value);if(v>0.5&&v<3)S.fx=v;save();return render()}
 if(t.id==='buf'){const v=parseFloat(t.value);if(v>=0&&v<=50)S.buf=v;save();return render()}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.pin')){e.preventDefault();e.target.closest('.pin').dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
if(!S.custom||!S.custom.stops)S.custom={stops:[],n:{}};
render();
</script></body></html>
